name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # for GitHub Release creation
      id-token: write    # for npm provenance attestation (OIDC)
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Run smoke test
        run: npm run smoke-test

      - name: Run unit tests
        run: npm test

      - name: Publish to npm with provenance
        if: ${{ env.NPM_TOKEN != '' }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip npm publish (no NPM_TOKEN)
        if: ${{ env.NPM_TOKEN == '' }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: echo "NPM_TOKEN secret not set — skipping npm publish. Set it in repo secrets to enable auto-publish."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v2 (2026-04-26)
        with:
          generate_release_notes: true
